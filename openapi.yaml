openapi: 3.1.0
info:
  title: Budget API
  version: 1.0.0
  description: Contrato inicial do cálculo oficial de orçamento referencial.
paths:
  /health:
    get:
      summary: Verifica o estado do serviço
      operationId: health
      responses:
        '200':
          description: Serviço disponível.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /bdi:
    get:
      summary: Lista as configurações de BDI
      operationId: listBdis
      responses:
        '200':
          description: Configurações de BDI cadastradas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BDI'
  /bdi/{bdi_id}:
    get:
      summary: Retorna um BDI específico
      operationId: getBdi
      parameters:
        - name: bdi_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: BDI encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BDI'
        '404':
          description: BDI não encontrado
          content:
            application/json:
              schema:
                type: object
                required:
                  - detail
                properties:
                  detail:
                    type: string
  /budgets/calculate:
    post:
      summary: Calcula oficialmente um orçamento
      operationId: calculateBudget
      description: >
        Valida, resolve snapshots e overrides, calcula composições via
        composition-engine e consolida o resultado do Budget. Não persiste
        nem finaliza o orçamento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetCalculationRequest'
      responses:
        '200':
          description: Request processado; problemas de validação são retornados em issues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCalculationResponse'
        '400':
          description: Contrato HTTP inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '500':
          description: Erro inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
components:
  schemas:
    BDI:
      type: object
      required: [id, name, slug, method, quotas]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        method:
          $ref: '#/components/schemas/BDIMethod'
        quotas:
          type: array
          items:
            $ref: '#/components/schemas/BDIQuota'

    BDIMethod:
      type: object
      required: [id, method]
      properties:
        id:
          type: integer
        method:
          type: string

    BDIQuota:
      type: object
      required: [id, group, description, percentage, variable]
      properties:
        id:
          type: integer
        group:
          type: string
        description:
          type: string
        percentage:
          type: string
          pattern: '^\d+\.\d{6}$'
        variable:
          type: string

    BudgetCalculationRequest:
      type: object
      required: [project_id, source_file_uf, methodology, type_system, monetary_base_date, services]
      properties:
        project_id:
          type: string
        source_file_uf:
          type: string
          minLength: 2
          maxLength: 2
          pattern: '^[A-Z]{2}$'
        budget_id:
          type: [string, 'null']
        methodology:
          type: string
          enum: [SC, SN]
        type_system:
          type: string
          enum: [ON, NA, DS]
        monetary_base_date:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])-01$'
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceItemInput'
        overrides:
          $ref: '#/components/schemas/BudgetOverrides'

    ServiceItemInput:
      type: object
      required: [id, code, description, unit, quantity, compositions]
      properties:
        id:
          type: string
        code:
          type: string
        description:
          type: string
        unit:
          type: string
        quantity:
          oneOf:
            - type: number
            - type: string
        compositions:
          type: array
          items:
            $ref: '#/components/schemas/CompositionItemInput'

    CompositionItemInput:
      type: object
      required: [composition_id, reference_base_date, factor]
      properties:
        composition_id:
          type: string
        reference_base_date:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])-01$'
        factor:
          oneOf:
            - type: number
            - type: string

    BudgetOverrides:
      type: object
      additionalProperties: true

    CompositionOverride:
      type: object
      required: [composition_snapshot_id]
      additionalProperties: false
      properties:
        composition_snapshot_id:
          type: string
          minLength: 1
        production:
          type: number
          exclusiveMinimum: 0
        inputs:
          type: array
          items:
            type: object

    InputOverride:
      type: object
      required: [input_snapshot_id]
      additionalProperties: false
      properties:
        input_snapshot_id:
          type: string
          minLength: 1
        code:
          type: string
        description:
          type: string
        unit:
          type: string
        quantity:
          type: number
          minimum: 0

    MonetaryValueOverride:
      type: object
      required: [input_snapshot_id, value]
      additionalProperties: false
      properties:
        input_snapshot_id:
          type: string
          minLength: 1
        value:
          type: number

    BudgetCalculationResponse:
      type: object
      required: [calculation_id, budget, issues]
      properties:
        calculation_id:
          type: string
          minLength: 1
        budget:
          anyOf:
            - $ref: '#/components/schemas/CalculatedBudget'
            - type: 'null'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'

    CalculatedBudget:
      type: object
      required: [id, project_id, source_file_uf, methodology, type_system, monetary_base_date, total_cost, services]
      properties:
        id:
          type: string
        project_id:
          type: string
        source_file_uf:
          type: string
          minLength: 2
          maxLength: 2
          pattern: '^[A-Z]{2}$'
        methodology:
          type: string
          enum: [SC, SN]
        type_system:
          type: string
          enum: [ON, DS, NA]
        monetary_base_date:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])-01$'
        total_cost:
          type: string
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceItemResult'

    ServiceItemResult:
      type: object
      required: [id, code, quantity, unit_cost, total_cost, compositions]
      properties:
        id:
          type: string
        code:
          type: string
        description:
          type: string
        unit:
          type: string
        quantity:
          type: string
        unit_cost:
          type: string
        total_cost:
          type: string
        compositions:
          type: array
          items:
            $ref: '#/components/schemas/CompositionResult'

    CompositionResult:
      type: object
      required: [composition_id, reference_base_date, factor, unit_cost, total_cost]
      properties:
        composition_id:
          type: string
        reference_base_date:
          type: string
        factor:
          type: string
        unit_cost:
          type: string
        total_cost:
          type: string

    ValidationIssue:
      type: object
      required: [code, severity, entity, entity_id, message]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [INFO, WARNING, CRITICAL]
        entity:
          type: string
        entity_id:
          type: string
        message:
          type: string

    HttpError:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        details:
          description: Estrutura detalhada dos erros de validação.
